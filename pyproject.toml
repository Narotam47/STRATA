[project]
name = "strata-customer-analytics"
version = "0.1.0"
description = "Customer segmentation and lifetime value analytics on the 84.51 Complete Journey dataset"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.3.0",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "scikit-learn==1.6.1",
    "statsmodels==0.14.4",
    "lifetimes==0.11.3",
    "matplotlib==3.10.1",
    "seaborn==0.13.2",
    "jupyterlab==4.3.6",
    "pyarrow==19.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.11.6",
    "pytest==8.3.5",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
